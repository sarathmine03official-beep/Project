{% extends 'base.html' %}
{% block content %}
<div class="container py-8 bg-gray-50">
  <div class="row bg-white rounded-lg shadow-md overflow-hidden border border-gray-200">
    
    <!-- Product Image -->
    <div class="col-12 col-md-6 p-5 d-flex justify-content-center align-items-center bg-light">
      <div class="position-relative">
        <img src="{{ product.image.url }}" alt="{{ product.name }}" 
             class="w-100 h-96 object-cover rounded-lg hover:scale-105 transition-transform duration-300 shadow">
        <!-- Badge -->
        <span class="badge bg-warning text-dark position-absolute top-0 start-0 m-2">Best Seller</span>
        <!-- Wishlist Heart -->
        <button class="btn btn-light position-absolute top-0 end-0 m-2 rounded-circle shadow-sm">
          <svg xmlns="http://www.w3.org/2000/svg" fill="currentColor" viewBox="0 0 24 24" 
               class="w-5 h-5 text-secondary hover:text-danger">
            <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 
                     2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 
                     14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 
                     6.86-8.55 11.54L12 21.35z"/>
          </svg>
        </button>
      </div>
    </div>

    <!-- Product Details -->
    <div class="col-12 col-md-6 p-5">
      <h1 class="fw-bold text-dark fs-3 mb-2">{{ product.name }}</h1>
      <p class="text-muted small mb-2">Category: <span class="fw-semibold text-primary">{{ product.category }}</span></p>
      <p class="text-secondary mb-4">{{ product.description }}</p>

      <!-- Rating -->
      <div class="d-flex align-items-center mb-3">
        <span class="text-warning">&#9733;&#9733;&#9733;&#9733;&#9734;</span>
        <span class="small text-muted ms-2">(4.3)</span>
      </div>

      <!-- Price Section -->
      <div class="d-flex align-items-center gap-2 mb-3">
        <span class="fw-bold text-success fs-4">₹{{ product.price }}</span>
        <span class="text-muted text-decoration-line-through">₹{{ product.old_price }}</span>
        <span class="text-success fw-semibold">{{ product.discount }}% off</span>
      </div>

        <!-- Action Buttons -->
        <div class="d-flex gap-3 mt-8">
          <!-- Add to Cart -->
          <button class="btn btn-outline-warning fw-semibold px-4 py-2 rounded-pill shadow-sm 
                        hover:bg-warning hover:text-white transition"><a href="{% url 'add_to_cart' product.id %}" >
            🛒 Add to Cart</a>
          </button>

          <!-- Buy Now Button -->
          <button class="btn btn-success fw-bold px-4 py-2 rounded-pill shadow-sm hover:bg-success-dark transition">
            <a href="{% url 'buy_now' product.id %}" class="text-white no-underline">
              ⚡ Buy Now
            </a>
          </button>


        </div>

    </div>
  </div>
</div>
{% endblock %}

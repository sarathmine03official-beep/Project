{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sidebar Example</title>

  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Optional: Custom CSS -->
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="bg-gray-100">
<!-- Sidebar -->
<div class="d-flex flex-column flex-shrink-0 bg-light border-end shadow-sm h-100">
  <a href="/" class="d-flex align-items-center mb-3 mt-3 text-decoration-none px-3">
    <svg class="bi pe-none me-2" width="40" height="32" aria-hidden="true">
      <use xlink:href="#bootstrap"></use>
    </svg>
    <span class="fs-4 fw-bold text-dark">Sidebar</span>
  </a>
  <hr class="mx-3" />

  <ul class="nav nav-pills flex-column mb-auto px-2">
    <li class="nav-item">
      <a href="{% url 'home' %}" class="nav-link active d-flex align-items-center gap-2">
        🏠 <span>Home</span>
      </a>
    </li>
    <li><a href="{% url 'new_chat' %}" class="nav-link text-dark d-flex align-items-center gap-2">💬 AI Chatbot</a></li>
    <li><a href="{% url 'profile' %}" class="nav-link text-dark d-flex align-items-center gap-2">👤 Profile</a></li>
    <li><a href="{% url 'dashboard' %}" class="nav-link text-dark d-flex align-items-center gap-2">📊 Dashboard</a></li>
    <li><a href="{% url 'product_list' %}" class="nav-link text-dark d-flex align-items-center gap-2">📦 Products</a></li>
    <li><a href="{% url 'cart_view' %}" class="nav-link text-dark d-flex align-items-center gap-2">🛒 Cart</a></li>
    <li><a href="{% url 'book_appointment' %}" class="nav-link text-dark d-flex align-items-center gap-2">🩺 Book Appointment</a></li>
  </ul>

  <hr class="mx-3" />
  <div class="dropdown mt-auto px-3 mb-3">
    <a href="#" class="d-flex align-items-center text-decoration-none dropdown-toggle" data-bs-toggle="dropdown">
      <img src="https://github.com/mdo.png" alt="" width="32" height="32" class="rounded-circle me-2" />
      <strong>mdo</strong>
    </a>
    <ul class="dropdown-menu text-small shadow">
      <li><a class="dropdown-item" href="#">New project...</a></li>
      <li><a class="dropdown-item" href="#">Settings</a></li>
      <li><a class="dropdown-item" href="#">Profile</a></li>
      <li><hr class="dropdown-divider" /></li>
      <li><a class="dropdown-item" href="#">Sign out</a></li>
    </ul>
  </div>
</div>


</body>
</html>

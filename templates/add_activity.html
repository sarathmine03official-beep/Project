{% extends 'base.html' %}
{% block content %}
<div class="min-h-[80vh] flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 bg-gray-50">
  <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-bold text-gray-900">{{ title }}</h2>
      <p class="text-gray-600 mt-2">Add your workout activity here.</p>
    </div>

    <form method="POST" class="space-y-6">
      {% csrf_token %}

      <div class="space-y-4">
        {{ form.as_p }}
      </div>

      <button type="submit" class="w-full flex justify-center py-2 px-4 bg-blue-600 text-white font-semibold rounded-md hover:bg-blue-700 transition duration-200">
        Save Activity
      </button>
    </form>
  </div>
</div>
{% endblock %}

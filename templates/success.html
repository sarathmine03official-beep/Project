{% extends "base.html" %}
{% block title %}Success{% endblock %}
{% block content %}
<div class="flex items-center justify-center h-screen">
  <div class="bg-green-100 border border-green-400 text-green-700 px-6 py-4 rounded-xl shadow-lg">
    <h2 class="text-2xl font-bold mb-2">Appointment Booked Successfully!</h2>
    <p>Your appointment has been saved. You can view details in the Appointments List.</p>
    <a href="{% url 'view_appointments' %}"
       class="mt-4 inline-block bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600">
       View Appointments
    </a>
  </div>
</div>
{% endblock %}

{% extends "base.html" %}
{% load static %}
{% block content %}

<div class="flex flex-col md:flex-row items-center justify-center min-h-screen bg-gray-100 p-6">

  <!-- Left Column: Image -->
  <div class="md:w-1/2 flex justify-center mb-6 md:mb-0">
    <img src="{% static 'chekup/img1.png' %}" 
         alt="Health Check Illustration"
         class="w-80 md:w-96 rounded-lg shadow-lg">
  </div>

  <!-- Right Column: Form -->
  <div class="md:w-1/2 bg-white shadow-2xl rounded-xl p-8 w-full max-w-md">
    <h2 class="text-3xl font-bold text-center text-blue-600 mb-8">Health Check Form</h2>

    <form action="#" method="POST" class="space-y-6">
      {% csrf_token %}

      <!-- Blood Sugar -->
      <div class="border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition">
        <label for="bloodSugar" class="block text-sm font-semibold text-gray-700 mb-2">Blood Sugar (mg/dL)</label>
        <div class="flex space-x-3">
          <input type="text" id="bloodSugar" name="bloodSugar"
                 class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"
                 placeholder="Enter value">
          <button type="button"
                  class="bg-blue-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-blue-700 transition">
            Check
          </button>
        </div>
      </div>

      <!-- Blood Pressure -->
      <div class="border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition">
        <label for="bloodPressure" class="block text-sm font-semibold text-gray-700 mb-2">Blood Pressure (mmHg)</label>
        <div class="flex space-x-3">
          <input type="text" id="bloodPressure" name="bloodPressure"
                 class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"
                 placeholder="e.g. 120/80">
          <button type="button"
                  class="bg-green-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-green-700 transition">
            Check
          </button>
        </div>
      </div>

      <!-- Cholesterol -->
      <div class="border border-gray-200 rounded-lg p-4 shadow-sm hover:shadow-md transition">
        <label for="cholesterol" class="block text-sm font-semibold text-gray-700 mb-2">Cholesterol (mg/dL)</label>
        <div class="flex space-x-3">
          <input type="text" id="cholesterol" name="cholesterol"
                 class="flex-1 rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 p-2"
                 placeholder="Enter value">
          <button type="button"
                  class="bg-purple-600 text-white font-semibold px-4 py-2 rounded-md hover:bg-purple-700 transition">
            Check
          </button>
        </div>
      </div>

      <!-- Final Submit -->
      <div class="pt-6">
        <button type="submit"
                class="w-full bg-blue-700 text-white font-bold py-3 rounded-lg shadow hover:bg-blue-800 transition">
          ✅ Check Overall Health Status
        </button>
      </div>
    </form>
  </div>
</div>

{% endblock %}

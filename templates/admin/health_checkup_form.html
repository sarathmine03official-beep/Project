{% extends 'base.html' %}
{% block content %}
<div class="min-h-screen bg-gray-50 flex items-center justify-center py-10">
  <div class="bg-white shadow-xl rounded-lg p-8 w-full max-w-md border border-gray-200">
    <h2 class="text-2xl font-bold text-blue-600 mb-6 text-center">Health Check Form</h2>

    <form method="POST" class="space-y-5">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200">
        Check Overall Health Status
      </button>
    </form>
  </div>
</div>
{% endblock %}
